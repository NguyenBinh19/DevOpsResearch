services:
  notes-api:
    build: ../notes-api
    environment:
      NOTES_DB: /data/notes.db
      NOTES_HOST: 0.0.0.0
    volumes:
      - notes-data:/data
    ports:
      - "127.0.0.1:8000:8000"
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - notes-api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  notes-data:
